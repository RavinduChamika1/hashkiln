<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="HashKiln - Password Hashing Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#1A0F14"/></linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#DC2626"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8"><stop offset="0" stop-color="#FDE68A" stop-opacity="0.95"/><stop offset="0.5" stop-color="#FBBF24" stop-opacity="0.45"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><path d="M18 172 V92 A72 72 0 0 1 162 92 V172 Z"/></clipPath>
  </defs>
  <rect width="900" height="260" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="22.5" fill="none" stroke="#3A2024" stroke-width="3"/>

  <!-- Icon: a kiln (arch) with a hash symbol being hardened by heat -->
  <g transform="translate(42,38)">
    <path d="M18 172 V92 A72 72 0 0 1 162 92 V172 Z" fill="url(#arch)"/>
    <g clip-path="url(#clip)">
      <rect x="18" y="92" width="144" height="80" fill="url(#glow)"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
      <line x1="76" y1="52" x2="68" y2="130"/><line x1="110" y1="52" x2="102" y2="130"/>
      <line x1="54" y1="80" x2="132" y2="80"/><line x1="50" y1="106" x2="128" y2="106"/>
    </g>
    <rect x="6" y="172" width="168" height="12" rx="6" fill="#7C2D12"/>
  </g>

  <!-- Text -->
  <text x="262" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF">Hash<tspan fill="#FB923C">Kiln</tspan></text>
  <text x="264" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#B8A9AE">Password Hashing Lab</text>
  <rect x="264" y="182" width="64" height="5" rx="2.5" fill="#FB923C"/>
  <text x="264" y="218" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#85747A" letter-spacing="1">MD5  ·  SHA  ·  BCRYPT  ·  ARGON2  ·  SALT  ·  WEEK 2 OF 52</text>
</svg>
